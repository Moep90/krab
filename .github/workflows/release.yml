# Builds the release artifacts and attaches them to the GitHub release.
#
# Pushing a tag `vX.Y.Z` (matching the workspace version in Cargo.toml)
# builds the `krab` binary for Linux (x86_64, aarch64; glibc 2.35+) and
# macOS (Intel, Apple silicon), packages the VS Code extension, and creates
# the release with generated notes, or uploads to it if it already exists.
# Tags with a pre-release suffix (`v2.0.0-alpha.1`) are marked pre-release.
#
# Run it by hand (workflow_dispatch) to build the artifacts from any branch
# without publishing a release; they are kept as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "krab") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

  binary:
    name: krab (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross }}
          triple=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CARGO_TARGET_${triple^^}_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_${triple}=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "AR_${triple}=${{ matrix.cross }}-ar" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p krab --target ${{ matrix.target }}
      - name: Package
        run: |
          name=krab-${{ needs.version.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/krab LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: krab-${{ matrix.target }}
          path: krab-*.tar.gz
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: kapitan-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, binary, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes "${flags[@]}"
          fi
