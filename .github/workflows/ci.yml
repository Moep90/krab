# Checks every pull request and every push to main: formatting and clippy,
# the unit and fixture tests on Linux and macOS (the Python resolver tests
# need python3), and that the VS Code extension still packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the run in flight pointless. Runs on main
# are not cancelled: they are what the cache is saved from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Not RUSTFLAGS: that is part of the build fingerprint and of the cache key,
  # so setting it there costs a full rebuild and a cache miss on every run.
  # build.warnings does the same job without either (Cargo 1.97 and newer).
  CARGO_BUILD_WARNINGS: deny

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This action publishes no tags and normally takes the toolchain from
      # the ref, so a pinned commit has to name it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked

  test:
    # krab holds a unix socket, spawns python3, watches the filesystem and
    # builds paths by hand. Releases ship macOS binaries, so macOS is tested.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Python resolver tests run a user resolvers.py in python3; PyYAML
      # and omegaconf make the fixture parity test run against the real package.
      # kadet and jinja2 let the kadet evaluator test run.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml omegaconf kadet jinja2
      - run: cargo test --locked

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krab-vscode
          path: editors/vscode/*.vsix
