apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-multiline
data:
  literal: |
    line one
    line two
  strip: |-
    no final newline
    second line
  leading_space: " indented first line\nnext\n"
  trailing_space: "ends in a space\nlast "
---
apiVersion: v1
kind: Secret
stringData:
  keep: |+
    trailing blank lines kept


metadata:
  name: {{ .Release.Name }}-keep
