# MISSING (`???`) values reached through interpolations: the reference makes
# the whole interpolated value MISSING, and oc.select treats it as absent.
parameters:
  m: ???
  h: ???
  comp:
    output:
      host: ???
  names:
    x: X
  holder:
    inner: ${m}
    other: fine
  values:
    b_in_string: "host ${comp.output.host}"
  r_plain: ${comp.output.host}
  r_string: "host ${comp.output.host}"
  r_two: "${h}/${h}:latest"
  r_absent: "host ${comp.output.host} tls ${comp.output.tls}"
  r_key: ${names.${m}}
  r_child: ${m.y}
  r_default: ${default:${m},fallback}
  r_select: ${oc.select:comp.output.host,dflt}
  r_select_str: "x ${oc.select:comp.output.host,dflt}"
  r_select_null: ${oc.select:m}
  r_list:
    - ${m}
    - ok
  r_holder: ${holder}
  r_escaped: \${m}
  r_alias: ${values.b_in_string}
  r_literal: "a???"
  r_write: ${write:w_dst,m}
